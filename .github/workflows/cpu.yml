name: CPU infrastructure and fixtures
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: disabled
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact CPU dependencies
        run: python -m pip install --require-hashes -r requirements-cpu.lock
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check installation and collection
        run: python scripts/environment/offline_tests.py
      - name: Check dependency metadata
        run: python -m pip check
