name: CPU implementation and pipeline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      WANDB_MODE: disabled
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact CPU dependencies
        run: python -m pip install --require-hashes -r requirements-cpu.lock
      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check implementation imports and CLI
        run: python scripts/environment/check_pipeline.py
      - name: Run module and integration CPU tests
        run: python scripts/environment/offline_tests.py
      - name: Fresh-process P0 CPU pipeline
        run: python scripts/integration/audit_pipeline.py --output runs/smoke/ci/p0 --variants mtl_smart
      - name: Check persisted validation metadata and aggregation
        run: python scripts/integration/reproduce_validation_metadata.py --run-dir runs/smoke/ci/p0/mtl_smart
      - name: Check dependency metadata
        run: python -m pip check
