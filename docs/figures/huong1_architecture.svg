<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .base { fill:#f3f4f6; stroke:#6b7280; stroke-width:1.5; }
      .new  { fill:#eff6ff; stroke:#2563eb; stroke-width:2; }
      .tea  { fill:#eff6ff; stroke:#2563eb; stroke-width:2; stroke-dasharray:7 4; }
      .out  { fill:#ffffff; stroke:#6b7280; stroke-width:1.5; }
      .t  { font-size:15px; font-weight:600; fill:#111827; text-anchor:middle; }
      .s  { font-size:12px; fill:#374151; text-anchor:middle; }
      .sl { font-size:12px; fill:#374151; }
      .bl { font-size:12px; fill:#1d4ed8; }
      .g  { stroke:#4b5563; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .gb { stroke:#2563eb; stroke-width:1.6; fill:none; marker-end:url(#b); }
    </style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- title and legend -->
  <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Hướng 1: MTL + Consistency (R-Drop) + EMA self-distillation, dựng trên baseline NEU-ESC 2-task</text>
  <rect x="20" y="44" width="16" height="16" class="base"/><text x="44" y="57" class="sl">giữ nguyên baseline</text>
  <rect x="190" y="44" width="16" height="16" class="new"/><text x="214" y="57" class="sl">thêm mới</text>
  <rect x="300" y="44" width="16" height="16" class="tea"/><text x="324" y="57" class="sl">teacher EMA (không dropout, không gradient)</text>

  <!-- input -->
  <rect x="20" y="215" width="120" height="64" rx="8" class="base"/>
  <text x="80" y="242" class="t">Câu x</text>
  <text x="80" y="262" class="s">batch 128</text>

  <!-- student pass 1 -->
  <rect x="190" y="90" width="210" height="64" rx="8" class="base"/>
  <text x="295" y="117" class="t">Encoder θ_S</text>
  <text x="295" y="137" class="s">backbone base · dropout mask 1</text>
  <rect x="440" y="90" width="220" height="64" rx="8" class="base"/>
  <text x="550" y="117" class="t">Head baseline</text>
  <text x="550" y="137" class="s">[CLS]→Linear→SiLU→LN→ 4 | 10</text>
  <rect x="700" y="90" width="120" height="64" rx="8" class="out"/>
  <text x="760" y="117" class="t">p¹ₛ , p¹ₜ</text>
  <text x="760" y="137" class="s">lượt 1</text>

  <!-- student pass 2 -->
  <rect x="190" y="200" width="210" height="64" rx="8" class="new"/>
  <text x="295" y="227" class="t">Encoder θ_S (cùng trọng số)</text>
  <text x="295" y="247" class="s">dropout mask 2</text>
  <rect x="440" y="200" width="220" height="64" rx="8" class="new"/>
  <text x="550" y="227" class="t">Head (cùng trọng số)</text>
  <text x="550" y="247" class="s">lượt forward thứ hai</text>
  <rect x="700" y="200" width="120" height="64" rx="8" class="out"/>
  <text x="760" y="227" class="t">p²ₛ , p²ₜ</text>
  <text x="760" y="247" class="s">lượt 2</text>

  <!-- teacher -->
  <rect x="190" y="360" width="210" height="64" rx="8" class="tea"/>
  <text x="295" y="387" class="t">Encoder θ_T (EMA)</text>
  <text x="295" y="407" class="s">eval mode · stop-gradient</text>
  <rect x="440" y="360" width="220" height="64" rx="8" class="tea"/>
  <text x="550" y="387" class="t">Head θ_T (EMA)</text>
  <text x="550" y="407" class="s">trung bình trọng số theo thời gian</text>
  <rect x="700" y="360" width="120" height="64" rx="8" class="out"/>
  <text x="760" y="387" class="t">pᵀₛ , pᵀₜ</text>
  <text x="760" y="407" class="s">soft target</text>

  <!-- EMA update -->
  <path d="M245,264 L245,358" class="gb"/>
  <text x="255" y="300" class="bl">θ_T ← μ·θ_T + (1−μ)·θ_S</text>
  <text x="255" y="317" class="bl">sau mỗi bước tối ưu, μ = 0.999</text>

  <!-- input arrows -->
  <path d="M140,235 L165,235 L165,122 L188,122" class="g"/>
  <path d="M140,247 L188,232" class="gb"/>
  <path d="M140,262 L165,262 L165,392 L188,392" class="gb"/>

  <!-- row arrows -->
  <path d="M400,122 L438,122" class="g"/><path d="M660,122 L698,122" class="g"/>
  <path d="M400,232 L438,232" class="gb"/><path d="M660,232 L698,232" class="gb"/>
  <path d="M400,392 L438,392" class="gb"/><path d="M660,392 L698,392" class="gb"/>

  <!-- losses -->
  <rect x="880" y="80" width="300" height="74" rx="8" class="base"/>
  <text x="1030" y="106" class="t">L_CE = CEₛ + CEₜ</text>
  <text x="1030" y="126" class="s">trên p¹ và p² (trung bình), như baseline</text>
  <text x="1030" y="143" class="s">nhãn thật yₛ, yₜ</text>

  <rect x="880" y="190" width="300" height="84" rx="8" class="new"/>
  <text x="1030" y="216" class="t">L_cons (R-Drop), mỗi task</text>
  <text x="1030" y="236" class="s">½ [ KL(p¹‖p²) + KL(p²‖p¹) ]</text>
  <text x="1030" y="256" class="s">ép 2 lượt dropout ra cùng dự đoán</text>

  <rect x="880" y="320" width="300" height="84" rx="8" class="new"/>
  <text x="1030" y="346" class="t">L_kd (self-distillation), mỗi task</text>
  <text x="1030" y="366" class="s">KL( pᵀ ‖ p̄ ), p̄ = (p¹+p²)/2</text>
  <text x="1030" y="386" class="s">bật từ epoch 2 (teacher đã ổn định)</text>

  <path d="M820,114 L878,114" class="g"/>
  <path d="M820,130 L850,130 L850,215 L878,215" class="gb"/>
  <path d="M820,224 L850,224 L850,140 L878,140" class="g"/>
  <path d="M820,240 L878,240" class="gb"/>
  <path d="M820,392 L878,370" class="gb"/>
  <path d="M820,255 L860,255 L860,350 L878,350" class="gb"/>

  <!-- total -->
  <rect x="700" y="460" width="480" height="86" rx="8" class="new"/>
  <text x="940" y="488" class="t">L = Σ_task 0.5 · [ L_CE + α·L_cons + β·L_kd ]</text>
  <text x="940" y="510" class="s">gradient chỉ cập nhật θ_S</text>
  <text x="940" y="530" class="s">thay SMART của tác giả (nhiễu cộng vào token-id, gradient = None)</text>
  <path d="M1030,404 L1030,458" class="gb"/>
  <path d="M1110,154 L1110,182" stroke="#6b7280" stroke-width="1.2" fill="none"/>
  <path d="M1150,274 L1150,312" stroke="#2563eb" stroke-width="1.2" fill="none"/>

  <!-- inference -->
  <rect x="20" y="460" width="640" height="70" rx="8" class="tea"/>
  <text x="340" y="488" class="t">Suy luận: chỉ dùng θ_T (một model, chi phí như baseline)</text>
  <text x="340" y="510" class="s">teacher EMA ≈ ensemble theo thời gian của các trọng số student</text>

  <!-- rationale -->
  <text x="20" y="590" font-size="13" font-weight="600" fill="#111827">Vì sao (đo trên 140 model đã train):</text>
  <text x="20" y="612" class="sl">• 41–45% mẫu test có model đúng, có model sai tùy seed/cấu hình → phương sai lớn; ensemble 140 model +1.9 / +2.2 điểm accuracy.</text>
  <text x="20" y="632" class="sl">• Oracle nhãn chéo ≈ 0 và cos(gₛ, gₜ) ≈ 0 → nút thắt không nằm ở liên hệ hai nhãn mà ở độ ổn định của dự đoán.</text>
  <text x="20" y="652" class="sl">• L_cons giảm dao động theo dropout; L_kd + θ_T chưng cất "ensemble theo thời gian" vào một model duy nhất.</text>
</svg>
