assumptions:
- GitHub CSV is an alternative pinned revision; equal row counts do not prove HF/paper
  equivalence.
- Source unsegmented CSV is already curated/lowercased; keep its exact text, with
  no repeated cleaning, stopword removal, acronym expansion, Unicode normalization
  or deduplication.
- VnCoreNLP/RDRSegmenter 1.2 is chosen from PhoBERT upstream guidance, not a tool
  version specified by the NEU-ESC paper.
- VnCoreNLP sentence outputs are joined with a single space within the original sample;
  labels, rows, IDs and splits are unchanged.
- Original acronym dictionary and cleaning/segmentation script/version are not published
  in the pinned source; our segmented text is an explicit alternative, compared against
  author CSV.
- Integral numeric CSV label values such as 0.0 map exactly to IDs 0-3 and 0-9 as
  defined by paper Tables 1-2; null, nonintegral and out-of-range labels fail.
- No authorization to redistribute the GitHub dataset has been established; download
  caches/JSONL/resources stay local and excluded from Git.
