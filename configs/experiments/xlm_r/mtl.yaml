assumptions:
- Dataset is the pinned GitHub alternative revision and current VnCoreNLP segmentation
  from module 01; equivalence to gated HF/paper revision remains unverified.
- Paper does not identify checkpoint revisions. These immutable upstream SHAs were
  audited on 2026-10-11; paper-time revisions remain unknown.
- Paper omits training hyperparameters. AdamW lr=2e-5, length=128, ST=15 epochs, MTL=20
  epochs follow public scripts; other resolved settings are explicit assumptions.
- MTL classification sums mean CE with task weights 1/1 following paper; public 2-head
  trainer averages 0.5/0.5 instead.
- Physical batch 8, accumulation 16, effective batch 128 is a Colab memory assumption;
  microbatch means (MLM/SMART included) are sample-weighted. This differs from physical
  batch 128 with dropout.
- MTL uses first hidden token then Linear/SiLU/LayerNorm; public head dropout 0.2
  is declared but unused, so effective extra head dropout=0.0.
- ST uses each backbone's native AutoModelForSequenceClassification head as in public
  base_trainer; it does not reuse the MTL shared projection.
- SMART uses independent continuous embedding adversaries, linf radius 1e-3, noise
  std 1e-5, step 1e-3, 1 step, gradient epsilon 1e-6; radius is not specified in paper.
- SMART weight 0.02 follows repo; batchmean symmetric KL replaces repo final sum reduction.
  This is a documented normalization assumption, not an exact public-code reproduction.
- SMART disables dropout for clean/adversarial regularizer forwards and excludes special/pad
  tokens. Supervised/MLM forwards keep native encoder dropout 0.1.
- MLM uses independent Bernoulli token selection at p=0.30 and selected-token 80/10/10,
  excluding special/pad IDs; random replacement also excludes special IDs.
- MLM raw CE is sum per sentence. Divide by mean selected tokens per sentence once,
  yielding sum CE / selected count; public trainer divides an already mean CE again.
- MLM head is random untied Linear/SiLU/LayerNorm/Linear(hidden,vocab_size), not pretrained
  MLM weights; original code hardcodes 64001, unsuitable for ViSoBERT/XLM-R.
- 'Validation checkpoint: max mean task macro-F1, fixed 4/10 labels, earliest epoch
  wins ties. No test selection, no early stopping, no class weighting.'
- Epoch-linear scheduler ends at 0.2 for ST and 0.1 for MTL; full epochs are used
  despite inconsistent public script comments.
- fp32, deterministic algorithms, num_workers=0, num_threads=1, TF32 disabled; no
  clipping or warmup; AdamW weight decay=0.01 and betas=0.9/0.999 are saved defaults
  from public optimizer usage.
