[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neu-esc-reproduction"
version = "0.1.0"
description = "Auditable reproduction infrastructure for NEU-ESC"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
data = ["numpy", "pandas", "PyYAML"]
train = ["torch>=2.6", "transformers<5", "sentencepiece", "tqdm", "numpy", "PyYAML"]
eval = ["numpy", "scikit-learn", "matplotlib", "Pillow>=10.1", "pypdf", "PyYAML"]
llm = []
dev = ["pytest", "build"]

[dependency-groups]
data = ["neu-esc-reproduction[data]"]
train = ["neu-esc-reproduction[train]"]
eval = ["neu-esc-reproduction[eval]"]
llm = ["neu-esc-reproduction[llm]"]
dev = ["neu-esc-reproduction[dev]"]

[tool.uv.sources]
neu-esc-reproduction = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["neu_esc*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/environment/tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires an explicitly verified CUDA runtime",
  "network: requires external network access",
  "paid_api: requires separately authorized paid API requests",
  "dataset: requires the audited real dataset",
]
